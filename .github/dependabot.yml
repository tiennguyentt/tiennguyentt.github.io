version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine bumps arrive as one reviewable PR; majors stay separate so a
      # breaking change is never buried in a batch.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @astrojs/check peers typescript ^5 || ^6 only. TS 7 breaks npm ci + Vercel preview.
      - dependency-name: typescript
        versions: ['>=7']
      # Major; upgrade deliberately when ready.
      - dependency-name: prettier-plugin-astro
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
